services:
  auto-claimer:
    build:
      context: .
      target: runtime
    image: flare-autoclaimer:local
    env_file:
      - .env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
